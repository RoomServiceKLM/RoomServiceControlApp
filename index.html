<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f4933">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Room Service Control</title>
<style>
:root{--ink:#25291f;--muted:#68705d;--cream:#f3f0e7;--paper:#fbfaf5;--wine:#657153;--wine2:#3f4933;--gold:#c3aa7a;--line:#ddd8c8;--ok:#4f6445;--danger:#8b1f35;--shadow:0 16px 45px rgba(46,55,37,.13)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Jost,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}h1,h2,h3{font-family:"Josefin Sans",Georgia,serif;margin:0}
.shell{min-height:100vh}#app[hidden]{display:none}
.top{background:linear-gradient(120deg,var(--wine2),var(--wine));color:#fff;padding:26px clamp(18px,4vw,58px) 34px;position:relative;overflow:hidden}
.top h1{font:500 clamp(28px,5vw,52px)/1 "Josefin Sans",serif;letter-spacing:.08em;margin:20px 0 8px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand-logo{height:42px;width:auto}
.session{display:flex;align-items:center;gap:9px;color:#eef1e8;font-size:13px}
.session button{border:1px solid #ffffff55;background:#ffffff12;color:#fff;border-radius:9px;padding:6px 9px;font-family:"Josefin Sans";font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.btn{border:1px solid transparent;border-radius:12px;padding:10px 15px;font-weight:750;display:inline-flex;align-items:center;gap:7px;font-family:"Josefin Sans";font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.btn-primary{background:var(--gold);color:#21170b}
.btn-light{background:#ffffff14;color:#fff;border-color:#ffffff30}
.btn-wine{background:var(--wine);color:#fff}
.main{padding:0 clamp(14px,4vw,58px) 50px;margin-top:-1px}
.toolbar{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:14px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;position:sticky;top:10px;z-index:5}
.search{position:relative}.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px 0 42px;outline:none;font-size:14px}
.search span{position:absolute;left:15px;top:11px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin:22px 0 8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#eee7df;color:var(--muted);padding:9px 15px;border-radius:999px;font-weight:800;font-family:"Josefin Sans";font-size:11px;letter-spacing:.8px;text-transform:uppercase}
.tab.active{background:var(--wine);color:#fff;border-color:var(--wine)}
.summary{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin:12px 2px 20px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 5px 18px #2e37250a;display:flex;flex-direction:column;min-height:180px;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:850;color:var(--wine);background:#e5e9dd;padding:4px 10px;border-radius:999px}
.ref{color:var(--muted);font-size:12px}
.card h3{font:500 20px/1.22 "Josefin Sans",serif;margin:4px 0}
.room{font-size:13px;color:var(--muted);margin-bottom:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{background:#e5e9dd;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700}
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:12px}
.info-row div small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.info-row div strong{display:block;font-size:13px;margin-top:2px}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.card-foot .time{font-size:11px;color:var(--muted)}
.card-foot .actions-row{display:flex;gap:6px}
.act-btn{border:0;border-radius:8px;padding:7px 11px;font-size:11px;font-weight:800;cursor:pointer;font-family:"Josefin Sans";letter-spacing:.5px;text-transform:uppercase}
.act-cook{background:var(--gold);color:#21170b}
.act-delivery{background:#d4c9a8;color:#21170b}
.act-done{background:var(--ok);color:#fff}
.act-way{background:#1e5aa8;color:#fff}
.act-pickup{background:var(--wine);color:#fff}
.act-view{background:#e5e9dd;color:var(--wine2)}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.loader{padding:80px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;z-index:20;background:#20201e;color:#fff;border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);transform:translateY(100px);opacity:0;transition:.25s;font-size:13px}
.toast.show{transform:none;opacity:1}
.toast.error{background:var(--danger)}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 22px));max-height:92vh;box-shadow:0 30px 90px #21091466;background:var(--paper)}dialog::backdrop{background:#1c1210a6;backdrop-filter:blur(3px)}
.modal-head{position:sticky;top:0;background:var(--paper);z-index:2;display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.modal-head h2{font:500 24px "Josefin Sans",serif;margin:0}
.close{border:0;background:#eee7df;border-radius:50%;width:35px;height:35px;font-size:20px;cursor:pointer}
.form{padding:20px 22px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12px;font-weight:850;color:#5f534b;text-transform:uppercase;letter-spacing:.5px}
.field input,.field textarea,.field select{width:100%;border:1px solid #dcd0c5;border-radius:11px;background:#fff;padding:10px 11px;outline:none;font-size:14px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--wine);box-shadow:0 0 0 3px #6f173512}
.field textarea{min-height:60px;resize:vertical}
.modal-foot{position:sticky;bottom:0;background:var(--paper);padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.login-box{padding:28px}
.login-box h2{font:500 30px "Josefin Sans",serif;margin:8px 0}
.login-box p{color:var(--muted);font-size:14px}
.login-box input,.login-box select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;margin:13px 0 16px;font-size:14px;background:#fff}
.hidden{display:none!important}
#installBtn[hidden]{display:none}
@media(max-width:720px){.toolbar{grid-template-columns:1fr}.actions{flex-wrap:wrap}.top{padding-bottom:25px}.main{padding-inline:11px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="shell" id="app" hidden>
  <header class="top">
    <div class="brand-row">
      <img class="brand-logo" src="logo.svg" alt="Kimpton">
      <div class="session">
        <span id="sessionName"></span>
        <button onclick="doLogout()">Cerrar sesion</button>
      </div>
    </div>
    <h1>Room Service Control</h1>
    <div class="actions">
      <button class="btn btn-primary" onclick="openServiceModal()">+ Registrar servicio</button>
      <button class="btn btn-light" onclick="loadData()">&#x21bb; Actualizar</button>
      <button class="btn btn-light" id="installBtn" hidden onclick="installApp()">&#x2193; Instalar app</button>
    </div>
  </header>
  <main class="main">
    <div class="toolbar">
      <div class="search"><span>&#x2315;</span><input id="search" type="search" placeholder="Buscar habitacion, huesped..." autocomplete="off" oninput="render()"></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-status="all" onclick="setStatus(this)">Todas</button>
      <button class="tab" data-status="NEW" onclick="setStatus(this)">Nuevas</button>
      <button class="tab" data-status="IN_KITCHEN" onclick="setStatus(this)">En cocina</button>
      <button class="tab" data-status="DELIVERED" onclick="setStatus(this)">Entregadas</button>
      <button class="tab" data-status="pickup" onclick="setStatus(this)">Recogidas</button>
    </div>
    <div class="summary"><span id="resultCount">Cargando...</span><span id="updated"></span></div>
    <section id="content" class="loader">Cargando comandas...</section>
  </main>
</div>

<dialog id="loginModal">
  <div class="login-box">
    <div style="color:var(--wine);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase">Kimpton Los Monteros</div>
    <h2>Room Service</h2>
    <p>Selecciona tu nombre para entrar al panel de control.</p>
    <select id="staffInput">
      <option value="" disabled selected>-- Elige tu nombre --</option>
      <option value="Marlen">Marlen Andrade</option>
      <option value="Sandra">Sandra Rivera</option>
      <option value="Helena">Helena Carrasco</option>
      <option value="Gonzalo">Gonzalo Bueno</option>
      <option value="Gustavo">Gustavo Vidales</option>
      <option value="Alejandro">Alejandro Rodriguez</option>
      <option value="Rafa">Rafael Moreno</option>
      <option value="Ignacio">Ignacio Aparicio</option>
      <option value="Ivan">Ivan Zambrano</option>
    </select>
    <button class="btn btn-wine" type="button" onclick="doLogin()" style="width:100%;justify-content:center">Entrar</button>
    <p id="loginError" style="color:var(--danger);font-size:13px;margin-top:12px" class="hidden"></p>
  </div>
</dialog>

<dialog id="serviceModal">
  <form id="serviceForm" class="form" onsubmit="submitService(event)">
    <div class="modal-head">
      <h2>Registrar servicio</h2>
      <button type="button" class="close" onclick="document.getElementById('serviceModal').close()">&times;</button>
    </div>
    <div class="form">
      <div class="field"><label>Habitacion</label><input id="s_room" inputmode="numeric" placeholder="ej. 215" required></div>
      <div class="field"><label>Tipo de servicio</label>
        <select id="s_type" required>
          <option value="TRAY">Bandeja (con recogida)</option>
          <option value="TABLE_TROLLEY">Carro / Mesa (con recogida)</option>
          <option value="DRINKS_ONLY">Solo bebidas (sin recogida)</option>
        </select>
      </div>
      <div class="field"><label>Notas</label><textarea id="s_notes" placeholder="Alergias, preferencias, hora..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-light" onclick="document.getElementById('serviceModal').close()">Cancelar</button>
      <button type="submit" class="btn btn-wine">Registrar</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast"></div>

<script>
// Pega aquí la URL de la implementación de Apps Script terminada en /exec.
// No uses la URL del editor ni la antigua URL de Cloudflare.
const API = 'PEGA_AQUI_LA_URL_DE_APPS_SCRIPT_EXEC';
let staff = '';
let orders = [];
let currentStatus = 'all';
let installPrompt = null;

function apiReady() {
  return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(API);
}

async function apiPost(payload) {
  if (!apiReady()) throw new Error('Falta configurar la URL /exec de Apps Script en la constante API.');
  const response = await fetch(API, {
    method: 'POST',
    redirect: 'follow',
    // text/plain evita el preflight CORS que bloquea Apps Script desde GitHub Pages/PWA.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const text = await response.text();
  let data;
  try { data = JSON.parse(text); }
  catch (error) { throw new Error('Apps Script devolvió una respuesta no válida. Revisa que la implementación permita acceso a cualquiera.'); }
  return data;
}

// ---------- PWA INSTALL ----------
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  installPrompt = e;
  document.getElementById('installBtn').hidden = false;
});
function installApp() {
  if (!installPrompt) return;
  installPrompt.prompt();
  installPrompt = null;
  document.getElementById('installBtn').hidden = true;
}
window.addEventListener('appinstalled', function() {
  document.getElementById('installBtn').hidden = true;
  toast('App instalada');
});

// ---------- AUTH ----------
function doLogin() {
  var name = document.getElementById('staffInput').value.trim();
  if (!name) {
    document.getElementById('loginError').textContent = 'Selecciona tu nombre.';
    document.getElementById('loginError').classList.remove('hidden');
    return;
  }
  document.getElementById('loginError').classList.add('hidden');
  startSession(name);
}
function startSession(name) {
  staff = name;
  localStorage.setItem('rs_staffName', staff);
  document.getElementById('sessionName').textContent = staff;
  document.getElementById('app').hidden = false;
  if (document.getElementById('loginModal').open) document.getElementById('loginModal').close();
  loadData();
}
function doLogout() {
  localStorage.removeItem('rs_staffName');
  staff = '';
  document.getElementById('app').hidden = true;
  document.getElementById('staffInput').value = '';
  document.getElementById('loginModal').showModal();
}
var saved = localStorage.getItem('rs_staffName');
if (saved) startSession(saved);
else document.getElementById('loginModal').showModal();

// ---------- DATA ----------
async function loadData() {
  document.getElementById('content').className = 'loader';
  document.getElementById('content').textContent = 'Cargando...';
  try {
    // Intentar health primero para ver si el backend responde
    const healthData = await apiPost({ action: 'health' });
    console.log('Health:', healthData);

    // Luego intentar dashboard
    const data = await apiPost({ action: 'dashboard', sessionToken: 'DUMMY', staffName: staff });
    console.log('Dashboard:', data);
    
    if (!data.ok) {
      throw new Error(data.error || 'El backend no reconoce la accion "dashboard". Necesitas actualizar el Apps Script.');
    }
    orders = data.orders || [];
    document.getElementById('updated').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
    render();
  } catch (err) {
    document.getElementById('content').className = 'empty';
    document.getElementById('content').innerHTML = 
      '<h3>Error de conexion</h3>' +
      '<p>' + esc(err.message) + '</p>' +
      '<p style="font-size:12px;color:var(--muted);margin-top:10px">' +
      'Si ves "action post no reconocida", el Apps Script necesita una funcion <b>dashboard</b>. ' +
      'Pasa el codigo del nuevo Apps Script para arreglarlo.</p>';
    toast(err.message, true);
  }
}

// ---------- RENDER ----------
function render() {
  var q = String(document.getElementById('search').value || '').toLowerCase().trim();
  var list = orders;
  if (currentStatus === 'pickup') {
    list = orders.filter(function(o) {
      return o.pickupStatus && o.pickupStatus !== 'NOT_REQUIRED' && o.pickupStatus !== 'COMPLETED';
    });
  } else if (currentStatus !== 'all') {
    list = orders.filter(function(o) { return o.orderStatus === currentStatus; });
  }
  if (q) {
    list = list.filter(function(o) {
      return String(o.room || '').toLowerCase().includes(q) ||
             String(o.guest || '').toLowerCase().includes(q);
    });
  }
  document.getElementById('resultCount').textContent = list.length + ' comanda' + (list.length !== 1 ? 's' : '');
  if (!list.length) {
    document.getElementById('content').className = 'empty';
    document.getElementById('content').innerHTML = '<h3>No hay comandas</h3>';
    return;
  }
  document.getElementById('content').className = '';
  document.getElementById('content').innerHTML = '<div class="grid">' + list.map(card).join('') + '</div>';
}

function card(o) {
  var status = o.orderStatus || 'NEW';
  var pickup = o.pickupStatus && o.pickupStatus !== 'NOT_REQUIRED' ? (' · ' + o.pickupStatus) : '';
  var time = o.createdAt ? new Date(o.createdAt).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}) : '';
  var actions = '';
  
  if (status === 'NEW') {
    actions += '<button class="act-btn act-cook" onclick="act(\'startCooking\',\'' + o.orderId + '\')">Cocina</button>';
  } else if (status === 'IN_KITCHEN') {
    actions += '<button class="act-btn act-delivery" onclick="act(\'selectDeliveryType\',\'' + o.orderId + '\')">Entrega</button>';
  } else if (status === 'DELIVERED' && o.pickupStatus === 'REQUESTED') {
    var pid = o.pickups && o.pickups[0] ? o.pickups[0].pickupId : '';
    actions += '<button class="act-btn act-way" onclick="act(\'pickupOnWay\',\'' + pid + '\')">En camino</button>';
    actions += '<button class="act-btn act-done" onclick="act(\'completePickup\',\'' + pid + '\')">Recogido</button>';
  } else if (status === 'DELIVERED' && o.pickupStatus === 'ON_THE_WAY') {
    var pid2 = o.pickups && o.pickups[0] ? o.pickups[0].pickupId : '';
    actions += '<button class="act-btn act-done" onclick="act(\'completePickup\',\'' + pid2 + '\')">Recogido</button>';
  }
  actions += '<button class="act-btn act-view" onclick="viewOrder(\'' + o.orderId + '\')">Ver</button>';
  
  return '<article class="card">' +
    '<div class="card-head">' +
    '<span class="badge">' + esc(status) + esc(pickup) + '</span>' +
    '<span class="ref">Hab. ' + esc(o.room || '') + '</span>' +
    '</div>' +
    '<h3>' + esc(o.guest || 'Sin nombre') + '</h3>' +
    '<div class="room">' + esc(o.service || '') + '</div>' +
    '<div class="tags">' +
    (o.deliveryType ? '<span class="tag">' + esc(o.deliveryType) + '</span>' : '') +
    (o.notes ? '<span class="tag">' + esc(o.notes.slice(0,30)) + '</span>' : '') +
    '</div>' +
    '<div class="info-row">' +
    '<div><small>Total</small><strong>' + (o.total ? Number(o.total).toFixed(2).replace('.', ',') + ' €' : '—') + '</strong></div>' +
    '<div><small>Estado</small><strong>' + esc(status) + '</strong></div>' +
    '</div>' +
    '<div class="card-foot">' +
    '<span class="time">' + esc(time) + '</span>' +
    '<div class="actions-row">' + actions + '</div>' +
    '</div>' +
    '</article>';
}

function setStatus(btn) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  currentStatus = btn.dataset.status;
  document.getElementById('search').value = '';
  render();
}

// ---------- ACTIONS ----------
async function act(action, id) {
  try {
    var data = await apiPost({ action: action, sessionToken: 'DUMMY', orderId: id, pickupId: id, staffName: staff });
    if (!data.ok) throw new Error(data.error || 'Error');
    toast('Accion completada');
    loadData();
  } catch (err) {
    toast(err.message, true);
  }
}

function viewOrder(id) {
  var o = orders.find(function(x) { return x.orderId === id; });
  if (!o) return;
  alert('Detalle:\n\nHabitacion: ' + (o.room || '') + '\nHuesped: ' + (o.guest || '') + '\nEstado: ' + (o.orderStatus || '') + '\nTotal: ' + (o.total || '0') + ' €');
}

// ---------- REGISTER SERVICE ----------
function openServiceModal() {
  document.getElementById('serviceModal').showModal();
}

async function submitService(e) {
  e.preventDefault();
  var room = document.getElementById('s_room').value.trim();
  var type = document.getElementById('s_type').value;
  var notes = document.getElementById('s_notes').value.trim();
  
  try {
    var payload = {
      action: 'createManualService',
      sessionToken: 'DUMMY',
      staffName: staff,
      room: room,
      deliveryType: type,
      notes: notes
    };
    
    var data = await apiPost(payload);
    console.log('Service response:', data);
    
    if (!data.ok) throw new Error(data.error || 'Error al registrar');
    
    document.getElementById('serviceModal').close();
    document.getElementById('serviceForm').reset();
    toast('Servicio registrado');
    loadData();
  } catch (err) {
    toast(err.message, true);
  }
}

// ---------- UTILS ----------
function esc(v) {
  return String(v || '').replace(/[&<>'"]/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
  });
}
function toast(msg, error) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (error ? ' error' : '');
  setTimeout(function() { el.className = 'toast'; }, 3500);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function(error) {
      console.warn('No se pudo registrar el service worker:', error);
    });
  });
}
</script>
</body>
</html>
